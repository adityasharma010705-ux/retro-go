name: Build Retro-Go ESP32-S3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    env:
      IDF_TARGET: esp32s3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure S3 Target and Build Firmware
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh
          sed -i 's/"esp32-s3-devkit"/"esp32-s3-devkit", "my-s3-handheld"/g' rg_tool.py
          sed -i 's/RG_KEY_L2/RG_KEY_L/g; s/RG_KEY_R2/RG_KEY_OPTION/g' components/retro-go/targets/my-s3-handheld/config.h
          echo 'const char *rg_input_get_key_name(rg_key_t key) { return "KEY"; }' >> components/retro-go/rg_input.c
          python3 rg_tool.py --target my-s3-handheld --no-networking release

      - name: Upload Compiled Firmware (.img)
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-my-s3-handheld
          path: "*.img"
