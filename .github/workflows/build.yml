name: Build Retro-Go ESP32-S3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Retro-Go Firmware Image
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh
          for d in launcher retro-core prboom-go gwenesis fmsx; do
            cp components/retro-go/targets/my-s3-handheld/sdkconfig.defaults $d/sdkconfig.defaults
            (cd $d && idf.py set-target esp32s3)
          done
          python3 rg_tool.py --target my-s3-handheld release

      - name: Upload Compiled Firmware (.img)
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-my-s3-handheld
          path: "*.img"
