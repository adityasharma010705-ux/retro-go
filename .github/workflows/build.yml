name: Build Retro-Go ESP32-S3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    env:
      IDF_TARGET: esp32s3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure S3 Target and Build Firmware
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh
          sed -i 's/"esp32-s3-devkit"/"esp32-s3-devkit", "my-s3-handheld"/g' rg_tool.py
          python3 rg_tool.py --target my-s3-handheld release

      - name: Upload Compiled Firmware (.img)
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-my-s3-handheld
          path: "*.img"
