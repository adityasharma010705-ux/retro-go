name: Build Retro-Go ESP32-S3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    env:
      IDF_TARGET: esp32s3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply All ESP32-S3 Hardware, Display, Touch, and SD Fixes
        run: |
          git config --global --add safe.directory '*'
          . /opt/esp/idf/export.sh

          # 1. Create clean 16MB Flash partition table with 2MB app slots
          cat << 'EOF' > /opt/esp/idf/components/partition_table/partitions_singleapp.csv
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          phy_init, data, phy,     0xf000,  0x1000,
          factory,  app,  factory, 0x10000, 2M,
          EOF

          # 2. Register my-s3-handheld as an ESP32-S3 target
          sed -i 's/"esp32-s3-devkit"/"esp32-s3-devkit", "my-s3-handheld"/g' rg_tool.py

          # 3. Fix button key names, SELECT pin (GPIO 3), and helper function
          sed -i 's/RG_KEY_L2/RG_KEY_L/g; s/RG_KEY_R2/RG_KEY_OPTION/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/GPIO_NUM_26/GPIO_NUM_3/g' components/retro-go/targets/my-s3-handheld/config.h
          grep -q "rg_input_get_key_name" components/retro-go/rg_input.c || echo 'const char *rg_input_get_key_name(rg_key_t key) { return "KEY"; }' >> components/retro-go/rg_input.c

          # 4. Fix ILI9488 full-screen landscape rotation (RG_SCREEN_ROTATE 1) & crisp 20MHz SPI
          sed -i 's/#define RG_SCREEN_DRIVER.*/#define RG_SCREEN_DRIVER 1/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/#define RG_SCREEN_ROTATE.*/#define RG_SCREEN_ROTATE 1/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/SPI_MASTER_FREQ_40M/SPI_MASTER_FREQ_20M/g' components/retro-go/targets/my-s3-handheld/config.h

          # 5. Move SD Card to dedicated SPI3_HOST (CS=38, MOSI=39, SCK=40, MISO=45) to stop SPI bus conflicts
          sed -i 's/#define RG_STORAGE_SDSPI_HOST.*/#define RG_STORAGE_SDSPI_HOST SPI3_HOST/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/#define RG_GPIO_SDSPI_MOSI.*/#define RG_GPIO_SDSPI_MOSI GPIO_NUM_39/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/#define RG_GPIO_SDSPI_CLK.*/#define RG_GPIO_SDSPI_CLK GPIO_NUM_40/g' components/retro-go/targets/my-s3-handheld/config.h
          sed -i 's/#define RG_GPIO_SDSPI_MISO.*/#define RG_GPIO_SDSPI_MISO GPIO_NUM_45/g' components/retro-go/targets/my-s3-handheld/config.h

          # 6. Calibrate XPT2046 vertical touch axis (0xD0) for landscape screen
          sed -i 's/xpt2046_read_axis(0x90)/xpt2046_read_axis(0xD0)/g' components/retro-go/rg_input.c

      - name: Compile Retro-Go Firmware (.img)
        run: |
          . /opt/esp/idf/export.sh
          python3 rg_tool.py --target my-s3-handheld --no-networking release

      - name: Upload Compiled Firmware (.img)
        uses: actions/upload-artifact@v4
        with:
          name: retro-go-my-s3-handheld
          path: "*.img"
